name: build-binary
run-name: "build binary"

on:
  push:
    branches:
      - dev
      - beta
      - ci
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run packages/opencode/script/build.ts --skip-embed-web-ui
        env:
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-linux-x64
          path: packages/opencode/dist/opencode-linux-x64

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64